<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フローチャートパズル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 方眼紙の作図エリア（左）＋ブロック置き場（右／スマホでは下に固定） */
:root {
  --paper: #eef2f6;
  --sheet: #ffffff;
  --grid: #e1e8f0;
  --rule: #cdd6e2;
  --ink: #17223a;
  --muted: #5b6782;
  --line: #2a3552;
  --accent: #1d55d4;
  --accent-ink: #ffffff;
  --accent-soft: #e3ebff;
  --hl-fill: #ffe46b;
  --hl-stroke: #c78a00;
  --ok: #16834a;
  --ok-soft: #e1f5ea;
  --ng: #cf3434;
  --ng-soft: #fde8e8;
  --f-term: #eceff5;
  --f-proc: #e3edff;
  --f-dec: #fff0c4;
  --f-loop: #d8f1e2;
  --stroke: #2a3552;
  --slot-fill: rgba(29, 85, 212, 0.05);
  --slot-armed: rgba(29, 85, 212, 0.14);
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1320; --sheet: #141c2c; --grid: #1c2639; --rule: #2a3650;
    --ink: #e7edf8; --muted: #9ba8c2; --line: #b9c5de;
    --accent: #7aa2ff; --accent-ink: #0b1122; --accent-soft: #1d2b4f;
    --hl-fill: #6b5400; --hl-stroke: #ffd447;
    --ok: #4fd18b; --ok-soft: #11301f; --ng: #ff7272; --ng-soft: #3a1717;
    --f-term: #252e41; --f-proc: #1b2b4c; --f-dec: #3b3215; --f-loop: #163a29;
    --stroke: #b9c5de; --slot-fill: rgba(122, 162, 255, 0.06); --slot-armed: rgba(122, 162, 255, 0.18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1320; --sheet: #141c2c; --grid: #1c2639; --rule: #2a3650;
  --ink: #e7edf8; --muted: #9ba8c2; --line: #b9c5de;
  --accent: #7aa2ff; --accent-ink: #0b1122; --accent-soft: #1d2b4f;
  --hl-fill: #6b5400; --hl-stroke: #ffd447;
  --ok: #4fd18b; --ok-soft: #11301f; --ng: #ff7272; --ng-soft: #3a1717;
  --f-term: #252e41; --f-proc: #1b2b4c; --f-dec: #3b3215; --f-loop: #163a29;
  --stroke: #b9c5de; --slot-fill: rgba(122, 162, 255, 0.06); --slot-armed: rgba(122, 162, 255, 0.18);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.7; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { background: var(--sheet); border-bottom: 1px solid var(--rule); }
.top-in { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-block: 18px 16px; }
.eyebrow { display: block; font-size: 12px; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4.4vw, 38px); line-height: 1.15; margin: 2px 0 0; letter-spacing: 0.02em; }
h1 .arrow { color: var(--accent); }
.progress { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.progress b { font-family: var(--mono); color: var(--ink); font-size: 16px; }
.pbar { width: 120px; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }

/* category tabs */
.cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
.cat { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; cursor: pointer; text-align: left; min-width: 0; }
.cat svg { flex: none; }
.cat .nm { font-weight: 700; font-size: 15px; line-height: 1.3; }
.cat .ct { display: block; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.cat[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.cat:focus-visible, .chip:focus-visible, .blk:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ico .s { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.ico .f { fill: var(--accent); }
@media (max-width: 640px) {
  .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cat:last-child { grid-column: span 2; }
}

.subbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 14px; }
.cat-desc { margin: 0; color: var(--muted); font-size: 14px; flex: 1 1 320px; min-width: 0; }
.probs { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-width: 40px; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; font-family: var(--mono); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; justify-content: center; }
.chip.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chip .done { color: var(--ok); font-size: 13px; }
.chip.on .done { color: var(--ok); }

/* legend */
.legend { margin-top: 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; }
.legend summary { cursor: pointer; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 18px; padding: 4px 14px 14px; }
.lg { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.lg svg { flex: none; }
.lg b { display: block; font-size: 14px; }
.lg span { font-size: 13px; color: var(--muted); line-height: 1.55; display: block; }
.legend .note { padding: 0 14px 14px; margin: 0; font-size: 13px; color: var(--muted); }
.legend .note code { font-family: var(--mono); color: var(--ink); background: var(--grid); padding: 1px 6px; border-radius: 4px; }

/* main layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; margin-top: 18px; padding-bottom: 40px; align-items: start; }
.stage { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.q { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
.q-no { font-size: 12px; letter-spacing: 0.1em; font-weight: 700; color: var(--accent); }
.q h2 { margin: 2px 0 6px; font-size: 21px; line-height: 1.4; text-wrap: balance; }
.q p { margin: 0; max-width: 62ch; }
.q .inputs { margin-top: 8px; font-size: 13px; color: var(--muted); }
.q .inputs code { font-family: var(--mono); color: var(--ink); }

.chart {
  border: 1px solid var(--rule); border-radius: 12px; overflow: auto;
  background-color: var(--sheet);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px; background-position: -1px -1px;
  padding: 8px; text-align: center;
}
.chart svg { display: inline-block; height: auto; }

/* svg parts */
.sh rect, .sh polygon { stroke: var(--stroke); stroke-width: 1.6; }
.sh-term rect { fill: var(--f-term); }
.sh-proc rect { fill: var(--f-proc); }
.sh-dec polygon { fill: var(--f-dec); }
.sh-ls polygon, .sh-le polygon { fill: var(--f-loop); }
.tx { fill: var(--ink); font-size: 14px; font-family: var(--body); font-weight: 500; }
.ln { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; }
.ah { fill: var(--line); }
.yn { fill: var(--muted); font-size: 12px; font-weight: 700; font-family: var(--mono); }
.slot { cursor: pointer; outline: none; }
.slot-box { fill: var(--slot-fill); stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 6 5; }
.slot-q { fill: var(--accent); font-size: 13px; font-family: var(--body); font-weight: 700; }
.slot.armed .slot-box { fill: var(--slot-armed); animation: pulse 1.1s ease-in-out infinite; }
.slot.over .slot-box, .slot.over .placed rect, .slot.over .placed polygon { stroke-width: 3.2; stroke: var(--accent); }
.slot .hit { fill: transparent; stroke: none; }
.slot:focus-visible .hit { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 3 3; }
.slot:hover .slot-box { fill: var(--slot-armed); }
.badge circle { fill: var(--accent); }
.badge text { fill: var(--accent-ink); font-size: 12px; font-weight: 700; font-family: var(--mono); }
.slot.ok .badge circle { fill: var(--ok); }
.slot.ng .badge circle { fill: var(--ng); }
.slot.ok .placed rect, .slot.ok .placed polygon { stroke: var(--ok); stroke-width: 2.6; }
.slot.ng .placed rect, .slot.ng .placed polygon { stroke: var(--ng); stroke-width: 2.6; }
.cur rect:not(.hit), .cur polygon { fill: var(--hl-fill) !important; stroke: var(--hl-stroke) !important; stroke-width: 3 !important; }
@keyframes pulse { 50% { stroke-dashoffset: 11; } }
@media (prefers-reduced-motion: reduce) { .slot.armed .slot-box { animation: none; } .pbar i { transition: none; } }

/* feedback */
.feedback:empty { display: none; }
.feedback { border-radius: 12px; padding: 14px 16px; border: 1px solid var(--rule); background: var(--sheet); }
.feedback.ok { background: var(--ok-soft); border-color: var(--ok); }
.feedback.ng { background: var(--ng-soft); border-color: var(--ng); }
.feedback.info { background: var(--accent-soft); border-color: var(--accent); }
.feedback h3 { margin: 0 0 4px; font-size: 16px; }
.feedback ul { margin: 4px 0 0; padding-left: 1.2em; }
.feedback p { margin: 4px 0 0; max-width: 65ch; }
.feedback .next { margin-top: 10px; }

/* trace */
.trace { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
.trace h3 { margin: 0; font-size: 16px; }
.trace .lock { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.t-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.t-row label { font-size: 13px; color: var(--muted); }
.t-row input { font-family: var(--mono); font-size: 14px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); width: 220px; max-width: 100%; }
.t-note { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--paper); border-left: 4px solid var(--hl-stroke); font-weight: 500; min-height: 48px; }
.t-note .stepno { font-family: var(--mono); font-size: 12px; color: var(--muted); display: block; }
.t-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
@media (max-width: 560px) { .t-grid { grid-template-columns: minmax(0, 1fr); } }
.t-box h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em; color: var(--muted); }
.vars { display: flex; flex-wrap: wrap; gap: 6px; }
.var { font-family: var(--mono); font-size: 14px; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; background: var(--paper); font-variant-numeric: tabular-nums; }
.var.chg { border-color: var(--hl-stroke); background: var(--hl-fill); }
.console { font-family: var(--mono); font-size: 14px; background: var(--ink); color: var(--sheet); border-radius: 8px; padding: 8px 12px; min-height: 64px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
.console .empty { opacity: .6; font-family: var(--body); font-size: 13px; }

/* tools */
.tools { position: sticky; top: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.tools-head h3 { margin: 0; font-size: 16px; }
.tools-head .tip { font-size: 12px; color: var(--muted); display: block; line-height: 1.5; }
.palette { display: flex; flex-direction: column; gap: 8px; align-items: stretch; max-height: calc(100vh - 230px); overflow-y: auto; padding: 2px; }
.palette .empty { font-size: 13px; color: var(--muted); padding: 8px 0; }
.blk { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; cursor: grab; display: flex; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: pan-x; flex: none; }
.blk:hover { border-color: var(--accent); }
.blk.sel { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.blk svg { display: block; pointer-events: none; }
.ghost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; opacity: .92; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 1 1 auto; }
.btn[disabled] { opacity: .45; cursor: default; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .tools { position: sticky; top: auto; bottom: 0; border-radius: 12px 12px 0 0; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 18px rgba(0,0,0,.12); z-index: 5; gap: 8px; }
  .palette { flex-direction: row; overflow-x: auto; overflow-y: hidden; max-height: none; padding-bottom: 6px; }
  .blk svg { width: calc(var(--w) * 0.6); height: auto; }
  .tools-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .layout { padding-bottom: 0; }
  .stage { padding-bottom: 8px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <span class="eyebrow">情報Ⅰ ・ プログラムの基本構造</span>
      <h1>フローチャート<span class="arrow">↓</span>パズル</h1>
    </div>
    <div class="progress"><span><b id="pNum">0</b> / <span id="pAll">0</span> 問クリア</span><span class="pbar"><i id="pBar"></i></span></div>
  </div>
</header>

<main class="wrap">
  <nav class="cats" id="cats" role="tablist" aria-label="構造の種類"></nav>
  <div class="subbar">
    <p class="cat-desc" id="catDesc"></p>
    <div class="probs" id="probs" aria-label="問題"></div>
  </div>

  <details class="legend" id="legend">
    <summary>フローチャートの記号（クリックで表示）</summary>
    <div class="legend-grid" id="legendGrid"></div>
    <p class="note"><code>a ← 3</code> は「変数 a に 3 を入れる（代入する）」という意味です。<code>≧</code> は「以上」、<code>≦</code> は「以下」です。</p>
  </details>

  <div class="layout">
    <section class="stage">
      <div class="q">
        <div class="q-no" id="qNo"></div>
        <h2 id="qTitle"></h2>
        <p id="qText"></p>
        <div class="inputs" id="qInputs"></div>
      </div>
      <div class="chart" id="chartBox"><svg id="chart" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="フローチャート"></svg></div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <section class="trace" id="trace"></section>
    </section>

    <aside class="tools" aria-label="ブロック置き場">
      <div class="tools-head">
        <h3>ブロック</h3>
        <span class="tip">ブロックを選んで「ここに置く」をタップ。ドラッグしても置けます。置いたブロックをタップすると戻せます。</span>
      </div>
      <div class="palette" id="palette"></div>
      <div class="actions">
        <button class="btn primary" id="btnCheck" type="button">答え合わせ</button>
        <button class="btn" id="btnHint" type="button">ヒント</button>
        <button class="btn" id="btnReset" type="button">やり直す</button>
      </div>
    </aside>
  </div>
</main>

<script>
/* ---------- 寸法 ---------- */
const S = { W: 220, H: 46, LW: 280, LH: 54, DW: 250, DH: 80, TW: 130, TH: 40, V: 34, G: 44, M: 24, LINE: 18 };
const CIRC = '⓪①②③④⑤⑥⑦⑧⑨⑩';
const SHAPE_NAME = { term: '端子', proc: '処理', dec: '判断', ls: 'ループ端（始め）', le: 'ループ端（終わり）' };

/* ---------- ノードを作る関数 ---------- */
const T = text => ({ t: 'term', text });
const P = (text, run) => ({ t: 'proc', text, run });
const D = (text, test) => ({ t: 'dec', text, test });
const LS = (text, spec) => ({ t: 'ls', text, ...spec });
const LE = text => ({ t: 'le', text });
const IF = (cond, yes, no = []) => ({ t: 'if', cond, yes, no });
const LOOP = (head, body, tail) => ({ t: 'loop', head, body, tail });
const WHILE = (cond, body) => ({ t: 'while', cond, body });
const $ = node => (node.slot = true, node);           // ブロックをはめる場所
const inp = k => (v, io) => { v[k] = io.read(); return `${k} に ${v[k]} を入力する`; };
const show = k => (v, io) => { io.print(v[k] === undefined ? '（値なし）' : v[k]); return `${k} の値 ${v[k]} を表示する`; };
const say = s => (v, io) => { io.print(s); return `「${s}」と表示する`; };
const loop1 = (to, by = 1) => ({ v: 'i', from: 1, to, by });
const loopText = (to, by = 1) => `ループ1\ni を 1 から ${to} まで ${by} ずつ増やす`;

/* ---------- 問題 ---------- */
const CATS = [
  { id: 'seq', name: '順次構造', desc: '上から順番に、1つずつ処理を実行する構造です。処理の「順番」が大切です。' },
  { id: 'branch', name: '分岐構造', desc: '条件が成り立つ（Yes）か成り立たない（No）かで、実行する処理を選ぶ構造です。' },
  { id: 'loop', name: '反復構造', desc: '同じ処理を何回も繰り返す構造です。ループ端ではさんだ部分や、判断から戻る矢印の部分が繰り返されます。' },
  { id: 'mix', name: '組み合わせ', desc: '順次・分岐・反復の3つを組み合わせると、どんな手順でも表せます。' },
  { id: 'life', name: '日常生活', desc: '毎日の行動も、順次・分岐・反復を組み合わせたアルゴリズムとして表せます。身近な手順をフローチャートにしてみよう。' },
];
const HOT = ['カレー', 'ごはん', 'ぎょうざ', 'シチュー'];

const PROBLEMS = [
  { id: 'seq1', cat: 'seq', title: '長方形の面積',
    text: '縦の長さ a と横の長さ b を入力して、長方形の面積 s を求めて表示するフローチャートを完成させよう。',
    vars: ['a', 'b', 's'], inputs: [4, 6],
    flow: [T('開始'), P('a を入力する', inp('a')), P('b を入力する', inp('b')),
      $(P('s ← a × b', v => { v.s = v.a * v.b; })), $(P('s を表示する', show('s'))), T('終了')],
    decoys: [['proc', 's ← a + b'], ['dec', 's ← a × b'], ['proc', 'a を表示する']],
    hint: '面積は「縦 × 横」です。計算や入力・表示は、どの記号で書くのだったかな？',
    explain: '計算・代入・入力・表示などの処理は長方形の「処理」の記号で書きます。順次構造では、上から順に1つずつ実行されます。' },

  { id: 'seq2', cat: 'seq', title: '消費税込みの値段',
    text: '品物の値段 p を入力して、消費税10%を含めた値段 t を表示しよう。3つのブロックを正しい順番に並べてね。',
    vars: ['p', 't'], inputs: [500],
    flow: [T('開始'), $(P('p を入力する', inp('p'))), $(P('t ← p × 1.1', v => { v.t = Math.round(v.p * 1.1 * 100) / 100; })),
      $(P('t を表示する', show('t'))), T('終了')],
    decoys: [['proc', 't ← p + 1.1'], ['term', 't を表示する']],

/* ---------- 準備 ---------- */
PROBLEMS.forEach(p => {
  p.leaves = []; p.slots = []; let k = 0;
  const leaf = n => { n.nid = 'n' + (k++); p.leaves.push(n); if (n.slot) { p.slots.push(n); n.no = p.slots.length; } };
  const walk = list => list.forEach(n => {
    if (n.t === 'loop') { leaf(n.head); walk(n.body); leaf(n.tail); }
    else if (n.t === 'if') { leaf(n.cond); walk(n.yes); walk(n.no); }
    else if (n.t === 'while') { leaf(n.cond); walk(n.body); }
    else leaf(n);
  });
  walk(p.flow);
});
const byId = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));

/* ---------- SVG ヘルパー ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const flat = s => s.replace(/\n/g, '');
function size(s, text) {
  const n = String(text || '').split('\n').length;
  switch (s) {
    case 'term': return [S.TW, S.TH];
    case 'dec': return [S.DW, S.DH];
    case 'ls': case 'le': return [S.LW, S.LH + Math.max(0, n - 2) * S.LINE];
    default: return [S.W, S.H + (n - 1) * S.LINE];
  }
}
function txt(cx, cy, text, cls = 'tx') {
  const L = String(text).split('\n'); const y0 = cy - (L.length - 1) * S.LINE / 2;
  return `<text class="${cls}" text-anchor="middle">${L.map((l, i) => `<tspan x="${cx}" y="${y0 + i * S.LINE}" dominant-baseline="central">${esc(l)}</tspan>`).join('')}</text>`;
}
function shape(s, cx, y, w, h, text, cls = '') {
  const x0 = cx - w / 2, x1 = cx + w / 2, y1 = y + h, c = 14; let g;
  if (s === 'term') g = `<rect x="${x0}" y="${y}" width="${w}" height="${h}" rx="${h / 2}"/>`;
  else if (s === 'proc') g = `<rect x="${x0}" y="${y}" width="${w}" height="${h}" rx="2"/>`;
  else if (s === 'dec') g = `<polygon points="${cx},${y} ${x1},${y + h / 2} ${cx},${y1} ${x0},${y + h / 2}"/>`;
  else if (s === 'ls') g = `<polygon points="${x0 + c},${y} ${x1 - c},${y} ${x1},${y + c} ${x1},${y1} ${x0},${y1} ${x0},${y + c}"/>`;
  else g = `<polygon points="${x0},${y} ${x1},${y} ${x1},${y1 - c} ${x1 - c},${y1} ${x0 + c},${y1} ${x0},${y1 - c}"/>`;

/* ---------- レイアウト（大きさを測る） ---------- */
function mSeq(seq) {
  let l = 0, r = 0, h = 0;
  seq.forEach((n, i) => { const m = mNode(n); l = Math.max(l, m.l); r = Math.max(r, m.r); h += m.h + (i ? S.V : 0); });
  return { l, r, h };
}
function mNode(n) {
  if (n.t === 'loop') {
    const b = mSeq(n.body), hw = S.LW / 2 + 30;
    return { l: Math.max(hw, b.l), r: Math.max(S.LW / 2, b.r), h: S.LH * 2 + (n.body.length ? b.h + 2 * S.V : S.V) };
  }
  if (n.t === 'if') {
    const y = mSeq(n.yes), no = mSeq(n.no);
    const dx = n.no.length ? Math.max(S.DW / 2 + 30, y.r + S.G + no.l) : Math.max(S.DW / 2 + 30, y.r + S.G);
    return { l: Math.max(S.DW / 2 + 30, y.l), r: dx + (n.no.length ? no.r : 10), h: S.DH + S.V + Math.max(y.h, no.h) + S.V * 0.7, dx };
  }
  if (n.t === 'while') {
    const b = mSeq(n.body);
    const back = Math.max(S.DW / 2 + 30, b.l) + 22, dx = Math.max(S.DW / 2 + 30, b.r + S.G);
    return { l: back + 8, r: dx + 8, h: S.DH + S.V + b.h + S.V, back, dx };
  }
  const [w, h] = size(n.t, n.text);
  return { l: w / 2 + (n.slot ? 30 : 0), r: w / 2, h };
}

/* ---------- 描画 ---------- */
let out = [];
const line = (pts, arrow) => out.push(`<path class="ln" d="M${pts.map(p => p.join(' ')).join(' L')}"${arrow ? ' marker-end="url(#ah)"' : ''}/>`);
const yn = (x, y, t, anchor = 'start') => out.push(`<text class="yn" x="${x}" y="${y}" text-anchor="${anchor}">${t}</text>`);

function drawSeq(seq, cx, y) {
  let cy = y;
  seq.forEach((n, i) => { if (i) { line([[cx, cy], [cx, cy + S.V]], true); cy += S.V; } cy = drawNode(n, cx, cy); });
  return cy;
}
function drawNode(n, cx, y) {
  if (n.t === 'loop') {
    let b = drawLeaf(n.head, cx, y);
    if (n.body.length) { line([[cx, b], [cx, b + S.V]], true); b = drawSeq(n.body, cx, b + S.V); }
    line([[cx, b], [cx, b + S.V]], true);
    return drawLeaf(n.tail, cx, b + S.V);
  }
  if (n.t === 'if') {
    const mm = mNode(n), ym = mSeq(n.yes), nm = mSeq(n.no);
    const bot = drawLeaf(n.cond, cx, y), mid = y + S.DH / 2, nx = cx + mm.dx;
    const mergeY = bot + S.V + Math.max(ym.h, nm.h) + S.V * 0.7;
    let yb = bot;
    if (n.yes.length) { line([[cx, bot], [cx, bot + S.V]], true); yb = drawSeq(n.yes, cx, bot + S.V); }
    line([[cx, yb], [cx, mergeY]]);
    if (n.no.length) {
      line([[cx + S.DW / 2, mid], [nx, mid], [nx, bot + S.V]], true);
      const nb = drawSeq(n.no, nx, bot + S.V);
      line([[nx, nb], [nx, mergeY], [cx + 1, mergeY]], true);
    } else line([[cx + S.DW / 2, mid], [nx, mid], [nx, mergeY], [cx + 1, mergeY]], true);
    yn(cx + 8, bot + 16, 'Yes'); yn(cx + S.DW / 2 + 8, mid - 8, 'No');
    return mergeY;
  }
  if (n.t === 'while') {
    const mm = mNode(n);
    const bot = drawLeaf(n.cond, cx, y), mid = y + S.DH / 2;
    line([[cx, bot], [cx, bot + S.V]], true);
    const bb = drawSeq(n.body, cx, bot + S.V);
    line([[cx, bb], [cx, bb + S.V * 0.5], [cx - mm.back, bb + S.V * 0.5], [cx - mm.back, y - S.V * 0.5], [cx - 1, y - S.V * 0.5]], true);
    line([[cx + S.DW / 2, mid], [cx + mm.dx, mid], [cx + mm.dx, bb + S.V], [cx + 1, bb + S.V]], true);
    yn(cx + 8, bot + 16, 'Yes'); yn(cx + S.DW / 2 + 8, mid - 8, 'No');
    return bb + S.V;

}
function drawLeaf(n, cx, y) {
  const [w, h] = size(n.t, n.text);

  const bid = state.placed[n.nid], b = bid && state.blocks[bid];
  const cls = ['slot', state.sel ? 'armed' : '', state.marks[n.nid] || ''].join(' ');
  const label = b ? `${CIRC[n.no]} ${SHAPE_NAME[b.s]}「${flat(b.text)}」（タップで戻す）` : `${CIRC[n.no]} 空いている場所`;
  out.push(`<g class="${cls}" data-slot="${n.nid}" data-nid="${n.nid}" tabindex="0" role="button" aria-label="${esc(label)}">`);
  if (b) {
    const [w2, h2] = size(b.s, b.text);
    out.push(shape(b.s, cx, y + (h - h2) / 2, w2, h2, b.text, 'placed'));
  } else {
    out.push(`<rect class="slot-box" x="${cx - w / 2}" y="${y}" width="${w}" height="${h}" rx="10"/>`);
    out.push(txt(cx, y + h / 2, 'ここに置く', 'slot-q'));
  }
  out.push(`<rect class="hit" x="${cx - w / 2 - 4}" y="${y - 4}" width="${w + 8}" height="${h + 8}" rx="10"/>`);
  out.push(`<g class="badge"><circle cx="${cx - w / 2 - 18}" cy="${y + h / 2}" r="11"/><text x="${cx - w / 2 - 18}" y="${y + h / 2}" text-anchor="middle" dominant-baseline="central">${n.no}</text></g>`);
  out.push('</g>');
  return y + h;
}

const chart = document.getElementById('chart');
function renderChart() {
  const p = byId[state.pid]; const m = mSeq(p.flow);

/* ---------- 問題の読み込み ---------- */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function loadProblem(pid) {

  const p = byId[pid];

  const list = [], seen = new Set();
  [...p.slots.map(n => [n.t, n.text]), ...p.decoys].forEach(([s, text]) => {
    const key = s + '|' + text; if (seen.has(key)) return; seen.add(key); list.push({ s, text });
  });
  state.blocks = {}; list.forEach((b, i) => { b.id = 'b' + i; state.blocks[b.id] = b; });
  state.order = shuffle(list.map(b => b.id));
  const idx = PROBLEMS.filter(x => x.cat === p.cat).indexOf(p) + 1;
  document.getElementById('qNo').textContent = `${CATS.find(c => c.id === p.cat).name} ・ 問題 ${idx}`;
  document.getElementById('qTitle').textContent = p.title;
  document.getElementById('qText').textContent = p.text;

  document.getElementById('fb').className = 'feedback'; document.getElementById('fb').innerHTML = '';
  renderNav(); renderPalette(); renderChart(); renderTrace();
}

/* ---------- ブロック置き場 ---------- */
const palette = document.getElementById('palette');
function renderPalette() {
  const used = new Set(Object.values(state.placed));
  const items = state.order.filter(id => !used.has(id));
  palette.innerHTML = items.length ? items.map(id => {
    const b = state.blocks[id];
    return `<button class="blk ${state.sel === id ? 'sel' : ''}" type="button" data-id="${id}" aria-pressed="${state.sel === id}" aria-label="${SHAPE_NAME[b.s]}「${esc(flat(b.text))}」">${shapeSvg(b.s, b.text, 0.82)}</button>`;
  }).join('') : '<div class="empty">ブロックはすべて置きました。</div>';
}
function place(bid, nid) {
  Object.keys(state.placed).forEach(k => { if (state.placed[k] === bid) { delete state.placed[k]; delete state.marks[k]; } });
  state.placed[nid] = bid; delete state.marks[nid];
  state.sel = null; changed();
}
function changed() {
  if (state.solved) { state.solved = false; stopTrace(); trace = null; renderTrace(); }
  const fb = document.getElementById('fb'); if (fb.classList.contains('ok')) { fb.className = 'feedback'; fb.innerHTML = ''; }
  renderPalette(); renderChart();
}

let suppressClick = false, drag = null, ghost = null;
palette.addEventListener('click', e => {
  const b = e.target.closest('.blk'); if (!b) return;
  if (suppressClick) { suppressClick = false; return; }
  state.sel = state.sel === b.dataset.id ? null : b.dataset.id;
  renderPalette(); renderChart();
});
palette.addEventListener('pointerdown', e => {
  const b = e.target.closest('.blk'); if (!b || e.button > 0) return;
  drag = { el: b, id: b.dataset.id, x: e.clientX, y: e.clientY, on: false, pid: e.pointerId, over: null };
});
function slotAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('[data-slot]') : null; }
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.on = true; const r = drag.el.getBoundingClientRect();
    drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
    ghost = drag.el.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = r.width + 'px';
    document.body.appendChild(ghost);
    state.sel = drag.id; renderChart();
  }
  e.preventDefault();
  ghost.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px)`;
  const s = slotAt(e.clientX, e.clientY), id = s && s.dataset.slot;
  if (id !== drag.over) {
    chart.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
    if (s) s.classList.add('over'); drag.over = id;
  }
}, { passive: false });
function endDrag(e, cancel) {

  }

}
window.addEventListener('pointerup', e => endDrag(e, false));

/* ---------- 場所をタップ ---------- */

/* ---------- 実行トレース ---------- */
function runFlow(p, inputs) {
  const v = {}, outs = [], steps = []; let k = 0;
  const io = {
    read() { if (k >= inputs.length) throw new Error('入力する値が足りません。値を増やしてください。'); return inputs[k++]; },
    print(s) { outs.push(String(s)); },
  };
  const rec = (n, note) => { steps.push({ nid: n.nid, note, vars: { ...v }, out: [...outs] }); if (steps.length > 800) throw new Error('繰り返しが多すぎます。'); };
  const seq = list => list.forEach(node);
  function node(n) {
    if (n.t === 'term') rec(n, n.text === '開始' ? 'プログラムを開始します。' : 'プログラムを終了します。');
    else if (n.t === 'proc') { const note = n.run ? n.run(v, io) : null; rec(n, note || n.text); }
    else if (n.t === 'if') { const r = n.cond.test(v); rec(n.cond, `「${flat(n.cond.text)}」は${r ? '成り立つ → Yes の道へ' : '成り立たない → No の道へ'}`); seq(r ? n.yes : n.no); }
    else if (n.t === 'while') {
      for (;;) { const r = n.cond.test(v); rec(n.cond, `「${flat(n.cond.text)}」は${r ? '成り立つ → Yes：繰り返す' : '成り立たない → No：ループを抜ける'}`); if (!r) break; seq(n.body); }
    } else if (n.t === 'loop') {
      const h = n.head; v[h.v] = h.from; let first = true;
      for (;;) {
        const go = v[h.v] <= h.to;
        rec(h, `${h.v} = ${v[h.v]}${first ? '（最初の値）' : ''}：${go ? `${h.to} 以下なので中の処理を実行する` : `${h.to} をこえたのでループを抜ける`}`);
        if (!go) break; first = false;
        seq(n.body);
        rec(n.tail, `ループ1 の始めに戻り、${h.v} を ${h.by} 増やす`);
        v[h.v] += h.by;
      }
    }
  }
  try { seq(p.flow); } catch (e) { steps.push({ nid: null, note: e.message, vars: { ...v }, out: [...outs], err: true }); }
  return steps;
}
const traceEl = document.getElementById('trace');
function renderTrace() {
  const p = byId[state.pid];
  if (!state.solved || !trace) {
    traceEl.innerHTML = `<h3>動きを確かめる</h3><p class="lock">すべての場所に正しいブロックを置くと、フローチャートを1ステップずつ実行して、変数の値や表示される内容を確かめられます。</p>`;
    return;
  }
  traceEl.innerHTML = `<h3>動きを確かめる</h3>
    ${p.inputs ? `<div class="t-row"><label for="tIn">入力する値${p.inputLabel ? `（${esc(p.inputLabel)}）` : ''}をカンマ区切りで</label><input id="tIn" type="text" value="${trace.inputs.join(', ')}"><button class="btn" type="button" id="tApply">この値で実行</button></div>` : ''}
    <div class="t-row">
      <button class="btn" type="button" id="tFirst">最初から</button>
      <button class="btn" type="button" id="tPrev">◀ 戻る</button>
      <button class="btn primary" type="button" id="tNext">1ステップ進む ▶</button>
      <button class="btn" type="button" id="tPlay">自動で再生</button>
    </div>
    <div class="t-note" id="tNote"></div>
    <div class="t-grid">
      <div class="t-box"><h4>変数の値</h4><div class="vars" id="tVars"></div></div>
      <div class="t-box"><h4>画面への表示</h4><div class="console" id="tOut"></div></div>
    </div>`;
  document.getElementById('tFirst').onclick = () => { stopTrace(); trace.i = 0; updateTrace(); };
  document.getElementById('tPrev').onclick = () => { stopTrace(); trace.i = Math.max(0, trace.i - 1); updateTrace(); };
  document.getElementById('tNext').onclick = () => { stopTrace(); stepTrace(); };
  document.getElementById('tPlay').onclick = () => {
    if (trace.timer) { stopTrace(); return; }
    if (trace.i >= trace.steps.length - 1) trace.i = 0;
    trace.timer = setInterval(() => { if (!stepTrace()) stopTrace(); }, 850);
    document.getElementById('tPlay').textContent = '一時停止'; updateTrace();
  };
  const ap = document.getElementById('tApply');
  if (ap) ap.onclick = () => {
    const vals = document.getElementById('tIn').value.split(/[,、\s]+/).filter(Boolean).map(x => isNaN(Number(x)) ? x : Number(x));
    if (!vals.length) { document.getElementById('tNote').innerHTML = '値をカンマで区切って入力してください（例：72, 45）。'; return; }
    stopTrace(); trace = { inputs: vals, steps: runFlow(p, vals), i: 0, timer: null }; renderTrace();
  };
  updateTrace();
}
function startTrace() {
  const p = byId[state.pid]; const inputs = p.inputs ? [...p.inputs] : [];
  trace = { inputs, steps: runFlow(p, inputs), i: 0, timer: null }; renderTrace();
}
function stepTrace() { if (trace.i >= trace.steps.length - 1) return false; trace.i++; updateTrace(); return true; }
function stopTrace() {
  if (trace && trace.timer) { clearInterval(trace.timer); trace.timer = null; }
  const b = document.getElementById('tPlay'); if (b) b.textContent = '自動で再生';
}
function updateTrace() {
  const p = byId[state.pid], st = trace.steps[trace.i], prev = trace.steps[trace.i - 1];
  document.getElementById('tNote').innerHTML = `<span class="stepno">ステップ ${trace.i + 1} / ${trace.steps.length}</span>${esc(st.note)}`;
  document.getElementById('tVars').innerHTML = p.vars.map(k => {
    const val = st.vars[k], chg = prev && prev.vars[k] !== val;
    return `<span class="var ${chg ? 'chg' : ''}">${k} = ${val === undefined ? '—' : esc(val)}</span>`;
  }).join('');
  const o = document.getElementById('tOut');
  o.innerHTML = st.out.length ? esc(st.out.join('\n')) : '<span class="empty">（まだ何も表示されていません）</span>';
  o.scrollTop = o.scrollHeight;
  document.getElementById('tPrev').disabled = trace.i === 0;
  document.getElementById('tNext').disabled = trace.i >= trace.steps.length - 1;
  applyHighlight();
}
function applyHighlight() {
  chart.querySelectorAll('.cur').forEach(x => x.classList.remove('cur'));
  if (!state.solved || !trace) return;
  const st = trace.steps[trace.i]; if (!st || !st.nid) return;
  const el = chart.querySelector(`[data-nid="${st.nid}"]`); if (el) el.classList.add('cur');
}

loadProblem('seq1');
</script>
